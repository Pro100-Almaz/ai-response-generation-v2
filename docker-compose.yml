#      - dev


  migrate:
    build:
      <<: *app-build
      target: production
    container_name: ai_response_generation_v2-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["/app/scripts/migrate.sh"]
    networks: [apps-net]
    profiles:
      - migrate

  test:
    build:
      <<: *app-build
      target: testing
    container_name: ai_response_generation_v2-test
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-testing}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_strong_pwd
      POSTGRES_SERVER: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: fastapi_db_test
      MUSEUM_API_BASE: ${MUSEUM_API_BASE}
      CATALOG_API_BASE: ${CATALOG_API_BASE}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT}
      BROKER_URL: ${BROKER_URL}
      BROKER_NEW_ARTIFACT_QUEUE: ${BROKER_NEW_ARTIFACT_QUEUE}
      MONOLITH_BASE_URL: ${MONOLITH_BASE_URL}
      MONOLITH_AUTH_AUDIENCE: ${MONOLITH_AUTH_AUDIENCE}
      MONOLITH_AUTH_TIMEOUT: ${MONOLITH_AUTH_TIMEOUT}
      MONOLITH_PUBLIC_KEY_PATH: ${MONOLITH_PUBLIC_KEY_PATH}
      PUBLISH_RETRIES: ${PUBLISH_RETRIES}
      PUBLISH_RETRY_BACKOFF: ${PUBLISH_RETRY_BACKOFF}
    depends_on:

      postgres-test:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - test_reports:/app/htmlcov
    networks: [apps-net]
    profiles:
      - test



volumes:

  redis_data:
    <<: *common-volume

  rabbitmq_data:
    <<: *common-volume

  app_logs:
    <<: *common-volume

  test_reports:
    <<: *common-volume


networks:
  apps-net:
    external: true
    name: apps-net

secrets:
  monolith_public_key:
    file: ./secrets/monolith_public_key.pem
