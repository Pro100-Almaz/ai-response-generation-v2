# YAML Anchors for common configurations
x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

# Network configuration is handled individually per service

x-common-volume: &common-volume
  driver: local

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEBUG: ${DEBUG:-false}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  MUSEUM_API_BASE: ${MUSEUM_API_BASE}
  CATALOG_API_BASE: ${CATALOG_API_BASE}
  HTTP_TIMEOUT: ${HTTP_TIMEOUT}
  BROKER_URL: ${BROKER_URL}
  BROKER_NEW_ARTIFACT_QUEUE: ${BROKER_NEW_ARTIFACT_QUEUE}
  PUBLISH_RETRIES: ${PUBLISH_RETRIES}
  PUBLISH_RETRY_BACKOFF: ${PUBLISH_RETRY_BACKOFF}
  MONOLITH_BASE_URL: ${MONOLITH_BASE_URL}
  MONOLITH_AUTH_AUDIENCE: ${MONOLITH_AUTH_AUDIENCE}
  MONOLITH_AUTH_TIMEOUT: ${MONOLITH_AUTH_TIMEOUT}
  MONOLITH_PUBLIC_KEY_PATH: ${MONOLITH_PUBLIC_KEY_PATH}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

x-app-dev-environment: &app-dev-environment
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  DEBUG: ${DEBUG:-true}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  MUSEUM_API_BASE: ${MUSEUM_API_BASE}
  CATALOG_API_BASE: ${CATALOG_API_BASE}
  HTTP_TIMEOUT: ${HTTP_TIMEOUT}
  BROKER_URL: ${BROKER_URL}
  BROKER_NEW_ARTIFACT_QUEUE: ${BROKER_NEW_ARTIFACT_QUEUE}
  PUBLISH_RETRIES: ${PUBLISH_RETRIES}
  PUBLISH_RETRY_BACKOFF: ${PUBLISH_RETRY_BACKOFF}
  MONOLITH_BASE_URL: ${MONOLITH_BASE_URL}
  MONOLITH_AUTH_AUDIENCE: ${MONOLITH_AUTH_AUDIENCE}
  MONOLITH_AUTH_TIMEOUT: ${MONOLITH_AUTH_TIMEOUT}
  MONOLITH_PUBLIC_KEY_PATH: ${MONOLITH_PUBLIC_KEY_PATH}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

# Test environment configuration is handled individually per service

# Migration configuration is handled individually per service

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ai_response_generation_v2-postgres-test
    environment:
      POSTGRES_DB: fastapi_db_test
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_strong_pwd
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_user -d fastapi_db_test"]
      <<: *common-healthcheck
    networks: [apps-net]
    profiles:
      - test

  redis:
    image: redis:7-alpine
    container_name: ai_response_generation_v2-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [apps-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai_response_generation_v2-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [apps-net]

  app:
    build:
      <<: *app-build
      target: production
    container_name: ai_response_generation_v2-app
    environment:
      <<: *app-environment
    secrets:
      - monolith_public_key
    depends_on:

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [apps-net]

