# YAML Anchors for development overrides
x-dev-environment: &dev-environment
  ENVIRONMENT: dev
  LOG_LEVEL: DEBUG

x-dev-volumes: &dev-volumes
  - ./src:/app/src
  - ./tests:/app/tests
  - ./alembic:/app/alembic
  - ./alembic.ini:/app/alembic.ini

x-dev-command: &dev-command
  command: ["uv","run","uvicorn","ai_response_generation_v2.main:app","--host","0.0.0.0","--port","8000","--reload","--reload-dir","/app/src"]

x-dev-database-env: &dev-database-env
  POSTGRES_DB: antiques_dev
  POSTGRES_USER: dev_user
  POSTGRES_PASSWORD: dev_password

x-dev-cache-command: &dev-cache-command
  command: redis-server --appendonly yes

# Network configuration is handled individually per service

services:
  app:
    build:
      target: development
    environment:
      <<: *dev-environment
    volumes: *dev-volumes
    <<: *dev-command

  redis:
    ports:
      - "6379:6379"
    <<: *dev-cache-command

  adminer:
    image: adminer:latest
    container_name: antiques-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks: [apps-net]
    profiles:
      - dev-tools
